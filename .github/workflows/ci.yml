name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Lets cli.yml (and other repos) reuse this pipeline instead of duplicating it.
  workflow_call:

jobs:
  test:
    name: pytest (locked deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run test suite
        run: uv run pytest tests/ -v
